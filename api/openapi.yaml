openapi: 3.1.0
info:
  title: SensorPulse Benchmark API
  version: 1.0.0
  description: Identical HTTP contract for five PostgreSQL backend implementations. No authentication.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Liveness without database query
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readings/{id}:
    get:
      operationId: getReading
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, format: int64 }
      responses:
        '200':
          description: Reading found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /readings:
    get:
      operationId: listReadings
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }
      responses:
        '200':
          description: Descending time/id results with offset pagination
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Reading' }
                  limit: { type: integer }
                  offset: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createReading
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingInput' }
      responses:
        '201':
          description: Created reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /readings/stats:
    get:
      operationId: readingStats
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Aggregate summary for one device in a half-open time interval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingStats' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /readings/batch:
    post:
      operationId: createReadingBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [readings]
              properties:
                readings:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/ReadingInput' }
      responses:
        '201':
          description: Atomic multi-row insert complete
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [inserted]
                properties:
                  inserted: { type: integer, minimum: 1, maximum: 100 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  parameters:
    DeviceId:
      name: deviceId
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
  schemas:
    ReadingInput:
      type: object
      additionalProperties: false
      required: [deviceId, temperatureCenti, humidityBp, observedAt]
      properties:
        deviceId: { type: integer, minimum: 1 }
        temperatureCenti: { type: integer, minimum: -5000, maximum: 10000 }
        humidityBp: { type: integer, minimum: 0, maximum: 10000 }
        observedAt: { type: string, format: date-time, description: 'Asia/Kolkata response normalized to YYYY-MM-DDTHH:mm:ss.SSS+05:30; any RFC 3339 offset is accepted on input' }
    Reading:
      allOf:
        - $ref: '#/components/schemas/ReadingInput'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
    ReadingStats:
      type: object
      additionalProperties: false
      required: [deviceId, count, temperatureSumCenti, humiditySumBp, temperatureMinCenti, temperatureMaxCenti]
      properties:
        deviceId: { type: integer }
        count: { type: integer, minimum: 0, format: int64 }
        temperatureSumCenti: { type: integer, format: int64 }
        humiditySumBp: { type: integer, format: int64 }
        temperatureMinCenti: { type: [integer, 'null'] }
        temperatureMaxCenti: { type: [integer, 'null'] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [bad_request, validation_error, not_found] }
  responses:
    BadRequest:
      description: Malformed JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid field, timestamp, query, or unknown device
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Reading ID does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
