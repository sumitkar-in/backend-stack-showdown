[global]
error_log = /proc/self/fd/2
log_level = error
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.backlog = 2048
; one PostgreSQL session per worker (persistent PDO), so children == DB connection budget
pm = static
pm.max_children = ${PHP_FPM_CHILDREN}
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
