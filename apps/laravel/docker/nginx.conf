worker_processes 2;                       # = app vCPU limit
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;
    keepalive_timeout 60s;
    keepalive_requests 1000000;           # nginx default would recycle connections
    client_max_body_size 1m;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream php {
        server unix:/tmp/php-fpm.sock;
        # No upstream keepalive: with fastcgi_keep_conn a PHP-FPM worker stays bound to its (idle) nginx connection,
        # so with more kept connections than workers the extra ones starve until they time out.
    }

    server {
        listen 8080 backlog=2048;
        root /app/public;

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_read_timeout 30s;
        }
    }
}
