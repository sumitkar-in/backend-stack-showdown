server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Tomcat: 200 request threads; unlimited keep-alive requests (default 100 would recycle connections).
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=60s
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-keep-alive-requests=-1
server.compression.enabled=false
server.error.whitelabel.enabled=false

# Fixed pool, min == max; server-side prepared statements from the first use.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sensorpulse}?prepareThreshold=1&tcpKeepAlive=true
spring.datasource.username=${DB_USER:bench}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=${DB_POOL_TOTAL:20}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_TOTAL:20}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=0
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.register-mbeans=false

# Quiet, lean runtime.
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
logging.level.root=ERROR

# Auth: AUTH_MODE=none (default) or jwt (HS256 bearer token on /readings/**)
app.auth.mode=${AUTH_MODE:none}
app.auth.jwt-secret=${JWT_SECRET:bench-jwt-secret-local-only}
