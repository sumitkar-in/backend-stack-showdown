[package]
name = "sensorpulse"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "=0.8.1", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "=1.42.0", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
sqlx = { version = "=0.8.3", default-features = false, features = ["runtime-tokio", "postgres", "time"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"
time = { version = "=0.3.37", features = ["parsing"] }
regex = "=1.11.1"
hmac = "=0.12.1"
sha2 = "=0.10.8"
base64 = "=0.22.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
